services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app/app       
      - ./run.py:/app/run.py
      - ./data:/app/data     
    environment:
      - FLASK_ENV=development

#Tunnel para abrir um link cloudfare
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://web:5000
    depends_on:
      - web