<!-- app/templates/conta_item.html -->
<div class="flex justify-between items-center p-4 bg-slate-50 rounded-xl hover:bg-slate-100 transition cursor-pointer">
    <div class="flex items-center space-x-4">
        <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold uppercase">
            {{ conta.nome[0] }}
        </div>
        <div>
            <p class="font-medium text-slate-900">{{ conta.nome }}</p>
            <p class="text-xs text-slate-500">{{ conta.tipo }}</p>
        </div>
    </div>
    <span class="font-semibold text-slate-700">R$ {{ "%.2f"|format(conta.saldo_atual) }}</span>
</div>
